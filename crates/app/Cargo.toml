[package]
name = "pdfviewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local-first macOS PDF viewer and editor"

[[bin]]
name = "PDFViewer"
path = "src/main.rs"

[dependencies]
pdf-core = { path = "../pdf-core" }
pdf-ocr = { path = "../pdf-ocr" }
pdfium-render.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image"] }
rfd = "0.17"
image.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
lopdf.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSString", "NSError", "NSArray"] }

[dev-dependencies]
tempfile.workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
pdfium-render = "0.9.4"
lopdf = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
imageproc = "0.27"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tempfile = "3"
log = "0.4"
base64 = "0.22"
